name: CI&CD

on: [ push ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install Poetry
        uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: 1.8.3

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        id: poetry-cache
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        run: poetry install

      - name: Lint with mypy
        run: poetry run mypy .

      - name: Lint with flake8
        run: poetry run flake8

      - name: Lint with black
        run: poetry run black . --check

      - name: Test with pytest
        run: poetry run pytest

  cd-dev:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' # Running this job only for dev branch
    steps:
      - uses: actions/checkout@v4

      # Must set up Docker Buildx, otherwise `push` input in docker/build-push-action won't work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push backend
        id: build_backend # Added ID for potential digest access later
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./compose/dev/django/Dockerfile
          push: true
          tags: ghcr.io/we-hack-studio/nuts-dev-backend:latest # Updated tag to lowercase
          cache-from: type=registry,ref=ghcr.io/we-hack-studio/nuts-dev-backend:latest # Updated cache ref to lowercase
          cache-to: type=inline

      - name: Build and push frontend
        id: build_frontend # Added ID for potential digest access later
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./compose/dev/node/Dockerfile
          push: true
          tags: ghcr.io/we-hack-studio/nuts-dev-frontend:latest # Updated tag to lowercase
          cache-from: type=registry,ref=ghcr.io/we-hack-studio/nuts-dev-frontend:latest # Updated cache ref to lowercase
          cache-to: type=inline

      - name: Image digest backend
        run: echo ${{ steps.build_backend.outputs.digest }}

      - name: Image digest frontend
        run: echo ${{ steps.build_frontend.outputs.digest }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3 # Updated to a specific tag
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            echo ${{ secrets.CR_PAT }} | docker login -u ${{ github.repository_owner }} --password-stdin ghcr.io # Updated username
            cd ~/apps/nuts # Updated path, adjust if needed
            docker-compose pull
            docker-compose up -d